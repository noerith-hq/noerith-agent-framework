name: Controlled release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic Version tag to release, for example v1.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: controlled-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          SEMVER_PATTERN='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "${VERSION}" =~ ${SEMVER_PATTERN} ]]; then
            echo "Version must be valid Semantic Versioning with a v prefix, for example v1.0.0." >&2
            exit 1
          fi
      - name: Ensure release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists." >&2
            exit 1
          fi

  publish:
    name: Publish release
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${VERSION}" \
            --generate-notes
